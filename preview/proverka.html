<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка сертификата · DF Институт Учителей</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(60vw 50vh at 0 0,rgba(170,186,130,.4),transparent 70%),radial-gradient(60vw 50vh at 100% 100%,rgba(232,214,176,.6),transparent 70%),#F1EDE2;font-family:"DM Sans",Arial,sans-serif;color:#2c3320}
.c{max-width:460px;margin:20px;padding:30px;border-radius:30px;background:rgba(255,255,255,.7);border:1px solid #fff;box-shadow:0 20px 40px -20px rgba(60,72,44,.5);text-align:center}
.ic{width:64px;height:64px;border-radius:22px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(160deg,#a8b880,#647644);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.ic.bad{background:linear-gradient(160deg,#e0cfa0,#b89a58)}.ic svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;margin:0 0 6px}p{margin:4px 0;color:#5d654b}b{color:#2c3320}</style></head><body><div class="c" id="r"></div>
<script>
/* Реестр выданных сертификатов. Куратор добавляет сюда строку при выдаче. */
var REG={'DF-2027-0001':{n:'Имя Фамилия (образец)',d:'23 ноября 2026'}};
var c=new URLSearchParams(location.search).get('c'),e=REG[c],r=document.getElementById('r');
r.innerHTML=e?'<div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div><h1>Сертификат подлинный</h1><p><b>'+e.n+'</b></p><p>Программа «Авторская методика: от идеи до диплома»</p><p>Выдан '+e.d+' · № '+c+'</p>':'<div class="ic bad"><svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h0"/></svg></div><h1>Сертификат не найден</h1><p>Номер '+(c||'не указан')+' отсутствует в реестре.</p>';
</script></body></html>
